name: Build WiFi Modules + Ath9k + R8188eu

on:
  workflow_dispatch:

env:
  ARCH: arm64
  LLVM: 1
  LLVM_IAS: 1
  # Must match uname -r on the phone exactly (letter 'o', not zero)
  LOCALVER: "-android15-8-o-g25c0665dd40c-4k"
  # Same compiler and cross settings used for every make call
  MAKE_ARGS: "ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-gnu-"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        # Repo must contain kernel source (6.6.118) at root and phone config as stock_config

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev \
            libelf-dev libncurses-dev dwarves cpio rsync python3 git \
            gcc-aarch64-linux-gnu wget gnupg

      - name: Install LLVM 18 (matches phone clang 18.0.0)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm18.list
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            sudo ln -sf /usr/lib/llvm-18/bin/$t /usr/local/bin/$t
          done
          clang --version
          ld.lld --version

      - name: Fetch external rtl8188eu source (if missing in tree)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -e
          if [ ! -d "drivers/net/wireless/realtek/rtl8188eu" ] && \
             [ ! -d "drivers/staging/rtl8188eu" ] && \
             [ ! -d "drivers/net/wireless/rtl8188eu_ext" ]; then
            echo "Cloning public rtl8188eu driver source..."
            git clone --depth=1 \
              https://github.com/lwfinger/rtl8188eu.git \
              drivers/net/wireless/rtl8188eu_ext
          fi

      - name: Configure
        run: |
          cp stock_config .config
          S=scripts/config
          $S --disable LOCALVERSION_AUTO
          $S --set-str LOCALVERSION "$LOCALVER"
          # BTF generation fails with pahole/clang mismatch; not needed for module loading
          $S --disable DEBUG_INFO_BTF
          $S --disable DEBUG_INFO_BTF_MODULES
          $S --module CFG80211
          $S --module MAC80211
          $S --enable CFG80211_WEXT
          $S --enable MAC80211_MESH
          $S --enable MAC80211_LEDS
          $S --module ATH9K
          $S --module ATH9K_HTC
          $S --module ATH9K_COMMON
          $S --module ATH_COMMON
          $S --module R8188EU
          $S --enable CFG80211_REQUIRE_SIGNED_REGDB || true
          $S --disable CFG80211_REQUIRE_SIGNED_REGDB
          $S --disable MODULE_SIG_FORCE
          $S --disable MODULE_SIG_ALL
          make $MAKE_ARGS olddefconfig
          grep -E 'CONFIG_(CFG80211|MAC80211|ATH9K|R8188EU|LOCALVERSION|CFI_CLANG|MODVERSIONS|DEBUG_INFO_BTF)=' .config || true
          make $MAKE_ARGS -s kernelrelease

      - name: Full kernel build (generates Module.symvers)
        run: |
          make -j$(nproc) $MAKE_ARGS Image modules

      - name: Build external and ath modules
        run: |
          export KBUILD_MODPOST_WARN=1

          # Build Ath9k drivers
          make -j$(nproc) $MAKE_ARGS M=drivers/net/wireless/ath modules \
            KCFLAGS="-Wno-error" || true

          # Build R8188eu driver (external source cloned above)
          if [ -d "drivers/net/wireless/rtl8188eu_ext" ]; then
            make -j$(nproc) $MAKE_ARGS -C "$PWD" M=drivers/net/wireless/rtl8188eu_ext modules \
              KCFLAGS="-Wno-error"
          else
            make -j$(nproc) $MAKE_ARGS M=drivers/net/wireless/realtek/rtl8188eu modules \
              KCFLAGS="-Wno-error" || \
            make -j$(nproc) $MAKE_ARGS M=drivers/staging/rtl8188eu modules \
              KCFLAGS="-Wno-error"
          fi

      - name: Collect and verify .ko files
        run: |
          mkdir -p out
          cp net/wireless/cfg80211.ko out/ || true
          cp net/mac80211/mac80211.ko out/ || true
          find drivers/net/wireless/ath -name "*.ko" -exec cp {} out/ \; || true
          find drivers/net/wireless/realtek/rtl8188eu -name "*.ko" -exec cp {} out/ \; || true
          find drivers/staging/rtl8188eu -name "*.ko" -exec cp {} out/ \; || true
          find drivers/net/wireless/rtl8188eu_ext -name "*.ko" -exec cp {} out/ \; || true

          echo "== Built .ko files =="
          ls -la out/
          echo "== vermagic (must equal phone uname -r) =="
          for f in out/*.ko; do
            echo "$f: $(modinfo -F vermagic "$f")"
          done
          echo "Expected: ${LOCALVER}"

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-modules
          path: out/*.ko
