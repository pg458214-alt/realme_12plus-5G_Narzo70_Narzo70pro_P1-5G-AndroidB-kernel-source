name: Build WiFi Modules + Ath9k + R8188eu

on:
  workflow_dispatch:

env:
  ARCH: arm64
  LLVM: 1
  LLVM_IAS: 1
  # Must match uname -r on the phone exactly
  LOCALVER: "-android15-8-0-g25c0665dd40c-4k"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        # Repo must contain kernel source at root and stock_config

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm flex bison bc libssl-dev \
            libelf-dev libncurses-dev dwarves cpio rsync python3 git \
            gcc-aarch64-linux-gnu

            - name: Fetch external rtl8188eu source (if missing in tree)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -e
          if [ ! -d "drivers/net/wireless/realtek/rtl8188eu" ] && \
             [ ! -d "drivers/staging/rtl8188eu" ] && \
             [ ! -d "drivers/net/wireless/rtl8188eu_ext" ]; then
            echo "Cloning public rtl8188eu driver source..."
            git clone --depth=1 \
              https://github.com/lwfinger/rtl8188eu.git \
              drivers/net/wireless/rtl8188eu_ext
          fi

      - name: Configure
        run: |
          KDIR="$GITHUB_WORKSPACE"
          cd "$KDIR"
          cp stock_config .config
          S=scripts/config
          $S --disable LOCALVERSION_AUTO
          $S --set-str LOCALVERSION "$LOCALVER"
          $S --module CFG80211
          $S --module MAC80211
          $S --enable CFG80211_WEXT
          $S --enable MAC80211_MESH
          $S --enable MAC80211_LEDS
          $S --module ATH9K
          $S --module ATH9K_HTC
          $S --module ATH9K_COMMON
          $S --module ATH_COMMON
          $S --module R8188EU
          $S --enable CFG80211_REQUIRE_SIGNED_REGDB || true
          $S --disable CFG80211_REQUIRE_SIGNED_REGDB
          $S --disable MODULE_SIG_FORCE
          $S --disable MODULE_SIG_ALL
          make olddefconfig \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          grep -E 'CONFIG_(CFG80211|MAC80211|ATH9K|R8188EU|LOCALVERSION)=' .config
          make -s kernelrelease

      - name: Prepare tree
        run: |
          make -j$(nproc) modules_prepare \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Build modules
        run: |
          export KBUILD_MODPOST_WARN=1

          # Build core wireless stacks
          make -j$(nproc) M=net/wireless modules \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          make -j$(nproc) M=net/mac80211 modules \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-

          # Build Ath9k drivers
          make -j$(nproc) M=drivers/net/wireless/ath modules \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- || true

          # Build R8188eu driver (in-tree or external fallback)
          if [ -d "drivers/net/wireless/rtl8188eu_ext" ]; then
            make -j$(nproc) -C "$PWD" M=drivers/net/wireless/rtl8188eu_ext modules \
              CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- || true
          else
            make -j$(nproc) M=drivers/net/wireless/realtek/rtl8188eu modules \
              CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- || \
            make -j$(nproc) M=drivers/staging/rtl8188eu modules \
              CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- || true
          fi

          mkdir -p out

          # Copy compiled .ko files
          cp net/wireless/cfg80211.ko out/ || true
          cp net/mac80211/mac80211.ko out/ || true
          find drivers/net/wireless/ath -name "*.ko" -exec cp {} out/ \; || true
          find drivers/net/wireless/realtek/rtl8188eu -name "*.ko" -exec cp {} out/ \; || true
          find drivers/staging/rtl8188eu -name "*.ko" -exec cp {} out/ \; || true
          find drivers/net/wireless/rtl8188eu_ext -name "*.ko" -exec cp {} out/ \; || true

          modinfo -F vermagic out/*.ko || true

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-modules
          path: out/*.ko
